[versions]

# AutoJs4 engine dependencies. Versions are pinned to the values declared by the AutoJs4
# repository (autojs/build.gradle, common/build.gradle, automator/build.gradle) so that the
# embedded engine behaves like the AutoJs4 application. Do not upgrade them independently.
# zh-CN: AutoJs4 引擎依赖, 版本与 AutoJs4 仓库各模块 build.gradle 声明的值一致, 使内嵌引擎的行为
# 与 AutoJs4 应用相同, 不要单独升级.
autojs4-androidx-annotation = "1.0.0"
autojs4-appcompat = "1.0.2"
autojs4-eventbus = "3.0.0"
autojs4-zip4j = "1.3.2"
autojs4-material-dialogs = "0.9.2.3"
autojs4-material = "1.1.0-alpha01"
autojs4-enhanced-floaty = "0.31"
autojs4-settingscompat = "1.1.5"
autojs4-roundedimageview = "2.3.0"
autojs4-okhttp = "3.10.0"
autojs4-jdeferred = "1.2.6"
autojs4-gson = "2.8.2"
autojs4-android-logging-log4j = "1.0.3"
autojs4-log4j = "1.2.17"
autojs4-glide = "4.2.0"

commons-compress = "1.28.0"
foojay-resolver-convention = "1.0.0"
junit = "4.13.2"
material = "1.13.0"
appcompat = "1.7.1"
test-junit-version = "1.3.0"
test-runner = "1.7.0"
xz = "1.10"

[libraries]

apache-commons-compress = { module = "org.apache.commons:commons-compress", version.ref = "commons-compress" }
tukaani-xz = { module = "org.tukaani:xz", version.ref = "xz" }

autojs4-androidx-annotation = { module = "androidx.annotation:annotation", version.ref = "autojs4-androidx-annotation" }
autojs4-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "autojs4-appcompat" }
autojs4-eventbus = { module = "org.greenrobot:eventbus", version.ref = "autojs4-eventbus" }
autojs4-zip4j = { module = "net.lingala.zip4j:zip4j", version.ref = "autojs4-zip4j" }
autojs4-material-dialogs = { module = "com.afollestad.material-dialogs:core", version.ref = "autojs4-material-dialogs" }
autojs4-material = { module = "com.google.android.material:material", version.ref = "autojs4-material" }
autojs4-enhanced-floaty = { module = "com.github.hyb1996:EnhancedFloaty", version.ref = "autojs4-enhanced-floaty" }
autojs4-settingscompat = { module = "com.github.hyb1996:settingscompat", version.ref = "autojs4-settingscompat" }
autojs4-roundedimageview = { module = "com.makeramen:roundedimageview", version.ref = "autojs4-roundedimageview" }
autojs4-okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "autojs4-okhttp" }
autojs4-jdeferred = { module = "org.jdeferred:jdeferred-android-aar", version.ref = "autojs4-jdeferred" }
autojs4-gson = { module = "com.google.code.gson:gson", version.ref = "autojs4-gson" }
autojs4-android-logging-log4j = { module = "de.mindpipe.android:android-logging-log4j", version.ref = "autojs4-android-logging-log4j" }
autojs4-log4j = { module = "log4j:log4j", version.ref = "autojs4-log4j" }
autojs4-glide = { module = "com.github.bumptech.glide:glide", version.ref = "autojs4-glide" }

junit = { module = "junit:junit", version.ref = "junit" }
test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "test-junit-version" }
test-runner = { module = "androidx.test:runner", version.ref = "test-runner" }

[plugins]

foojay-resolver-convention = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojay-resolver-convention" }
