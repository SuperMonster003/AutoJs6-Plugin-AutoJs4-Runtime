android.useAndroidX=true
# AutoJs4 depends on Material Dialogs 0.9.x and EnhancedFloaty, which still reference the Android
# Support Library; Jetifier rewrites them to AndroidX exactly as the AutoJs4 build does.
# zh-CN: AutoJs4 依赖的 Material Dialogs 0.9.x 与 EnhancedFloaty 仍引用 Android Support Library,
# Jetifier 将其改写为 AndroidX, 与 AutoJs4 自身的构建一致.
android.enableJetifier=true
# The AutoJs4 engine modules reference resources across modules through one merged R class.
# zh-CN: AutoJs4 引擎模块通过合并后的 R 类跨模块引用资源.
android.nonTransitiveRClass=false
android.nonFinalResIds=false
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
# AutoJs4 resolves androidx.vectordrawable 1.0.1 together with vectordrawable-animated 1.0.0, two
# 2018 artifacts that still share one manifest package. AGP 8+ treats that as an error by default;
# keep the AutoJs4 dependency set and downgrade it to the warning it used to be.
# zh-CN: AutoJs4 解析到的 androidx.vectordrawable 1.0.1 与 vectordrawable-animated 1.0.0 是两个 2018 年的
# 构件, 清单中仍共用同一个 package. AGP 8+ 默认视为错误; 为保持 AutoJs4 的依赖集, 这里降级为原先的警告.
android.uniquePackageNames=false
